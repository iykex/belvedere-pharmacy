version: 2.1

# Define reusable commands
commands:
  notify_telegram:
    description: "Send a notification to Telegram"
    parameters:
      message:
        type: string
    steps:
      - run:
          name: Send Telegram Notification
          command: |
            MESSAGE='<< parameters.message >>'
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                 -d chat_id="${TELEGRAM_CHAT_ID}" \
                 -d parse_mode="HTML" \
                 -d text="$MESSAGE"

jobs:
  deploy:
    docker:
      - image: cimg/base:stable

    steps:
      # Step 1: Checkout the repository
      - checkout

      # Step 2: Setup Git author (optional, for commit context)
      - run:
          name: Setup Git author for Vercel
          command: |
            git config user.name "iykex"
            git config user.email "aib.quame@gmail.com"

      # Step 3: Notify Telegram — Deployment Started
      - run:
          name: Notify Telegram — Deployment Started
          command: |
            COMMIT_SHA=$(git rev-parse --short HEAD)
            LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
            COMMITER_NAME=$(git log -1 --pretty=%an)
            TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
            REPO_NAME=$(basename $(git rev-parse --show-toplevel))
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
            ORG_NAME=$(git config --get remote.origin.url | sed 's#.*github.com[:/]##;s#/.*##;s/\.git$//')
            COMMIT_URL="https://github.com/$ORG_NAME/$REPO_NAME/commit/$COMMIT_SHA"

            MESSAGE="🚀 <b>Production Deployment Started</b>%0A"
            MESSAGE="$MESSAGE<b>Repository:</b> $REPO_NAME%0A"
            MESSAGE="$MESSAGE<b>Branch:</b> $BRANCH_NAME%0A"
            MESSAGE="$MESSAGE<b>Commit:</b> <a href=\"$COMMIT_URL\">$COMMIT_SHA</a>%0A"
            MESSAGE="$MESSAGE<b>Committer:</b> $COMMITER_NAME%0A"
            MESSAGE="$MESSAGE<b>Date:</b> $TIMESTAMP%0A"
            MESSAGE="$MESSAGE<b>Message:</b> $LAST_COMMIT_MSG"

            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                 -d chat_id="$TELEGRAM_CHAT_ID" \
                 -d parse_mode="HTML" \
                 -d text="$MESSAGE"

      # Step 4: Debug Git Info
      - run:
          name: Debug Git Info
          command: |
            echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
            echo "Current commit (full SHA): $(git rev-parse HEAD)"
            echo "Current commit (short SHA): $(git rev-parse --short HEAD)"
            echo "Circle branch: $CIRCLE_BRANCH"
            echo "Circle SHA: $CIRCLE_SHA1"
            echo "Remote branches:"
            git branch -r
            echo "All refs:"
            git show-ref

      # Step 5: Install jq for JSON processing
      - run:
          name: Install jq
          command: |
            sudo apt-get update && sudo apt-get install -y jq

      # Step 6: Create Vercel deployment payload (Production)
      - run:
          name: Prepare Vercel deployment payload
          command: |
            ORG_NAME="${CIRCLE_PROJECT_USERNAME}"
            REPO_NAME="${CIRCLE_PROJECT_REPONAME}"
            # Use the full commit SHA instead of branch name
            COMMIT_SHA="${CIRCLE_SHA1}"

            echo "✅ Using org: $ORG_NAME, repo: $REPO_NAME"
            echo "✅ Using commit SHA: $COMMIT_SHA"

            jq -n \
              --arg name "$REPO_NAME" \
              --arg ref "$COMMIT_SHA" \
              --arg target "production" \
              --arg type "github" \
              --arg org "$ORG_NAME" \
              --arg repo "$REPO_NAME" \
              '{
                name: $name,
                gitSource: {
                  type: $type,
                  org: $org,
                  repo: $repo,
                  ref: $ref
                },
                target: $target
              }' > payload.json

            echo "✅ Payload created"
            cat payload.json

      # Step 7: Debug payload
      - run:
          name: Debug payload
          command: cat payload.json

      # Step 8: Trigger Vercel Production Deployment (with retry)
      - run:
          name: Trigger Vercel Production Deployment (with retry)
          command: |
            ATTEMPT=1
            MAX_ATTEMPTS=3
            SUCCESS=false

            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
                echo "🔁 Attempt $ATTEMPT of $MAX_ATTEMPTS..."
                RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
                  -X POST "https://api.vercel.com/v13/deployments?skipAutoDetectionConfirmation=1" \
                  -H "Authorization: Bearer $VERCEL_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @payload.json)

                if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ]; then
                    echo "✅ Deployment successful!"
                    SUCCESS=true
                    break
                else
                    echo "⚠️ Deployment failed with status code: $RESPONSE"
                    echo "Response body:"
                    cat response.json
                    echo ""
                    
                    if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                        echo "Retrying in 10 seconds..."
                        sleep 10
                    fi
                fi
                ATTEMPT=$((ATTEMPT+1))
            done

            if [ "$SUCCESS" = false ]; then
                echo "❌ Deployment failed after $MAX_ATTEMPTS attempts."
                exit 1
            fi

      # Step 9: Notify Telegram — Deployment Success ✅
      - run:
          name: Notify Telegram — Deployment Success
          command: |
            REPO_NAME=$(basename $(git rev-parse --show-toplevel))
            MESSAGE="✅ <b>Production Deployment Successful</b>%0A<b>Repository:</b> $REPO_NAME%0A<b>Status:</b> Success 🎉"
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                -d chat_id="$TELEGRAM_CHAT_ID" \
                -d parse_mode="HTML" \
                -d text="$MESSAGE"

      # Step 10: Notify Telegram — Deployment Failed ❌
      - run:
          name: Notify Telegram — Deployment Failed
          when: on_fail
          command: |
            REPO_NAME=$(basename $(git rev-parse --show-toplevel))
            MESSAGE="❌ <b>Production Deployment Failed</b>%0A<b>Repository:</b> $REPO_NAME%0A<b>Status:</b> Failed 🚨"
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                -d chat_id="$TELEGRAM_CHAT_ID" \
                -d parse_mode="HTML" \
                -d text="$MESSAGE"

workflows:
  deploy-to-vercel:
    jobs:
      - deploy:
          filters:
            branches:
              only:
                - belvedere-dev