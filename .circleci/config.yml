version: 2.1

jobs:
  deploy:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - run:
          name: Install jq
          command: |
            sudo apt-get update
            sudo apt-get install -y jq

      - run:
          name: Setup Git author
          command: |
            git config user.name "iykex"
            git config user.email "aib.quame@gmail.com"

      - run:
          name: Notify Telegram — Deployment Started
          command: |
            set -e

            COMMIT_SHA=$(git rev-parse --short HEAD)
            LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
            COMMITER_NAME=$(git log -1 --pretty=%an)
            TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
            REPO_NAME=$(basename "$(git rev-parse --show-toplevel)")
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)

            REMOTE_URL=$(git config --get remote.origin.url)
            if echo "$REMOTE_URL" | grep -q "git@github.com:"; then
              ORG_NAME=$(echo "$REMOTE_URL" | sed -E 's#git@github.com:([^/]+)/.*#\1#')
            else
              ORG_NAME=$(echo "$REMOTE_URL" | sed -E 's#https?://github.com/([^/]+)/.*#\1#')
            fi

            COMMIT_URL="https://github.com/$ORG_NAME/$REPO_NAME/commit/$COMMIT_SHA"

            MESSAGE="🚀 <b>Production Deployment Started</b>%0A"
            MESSAGE="$MESSAGE<b>Repository:</b> $REPO_NAME%0A"
            MESSAGE="$MESSAGE<b>Branch:</b> $BRANCH_NAME%0A"
            MESSAGE="$MESSAGE<b>Commit:</b> <a href=\"$COMMIT_URL\">$COMMIT_SHA</a>%0A"
            MESSAGE="$MESSAGE<b>Committer:</b> $COMMITER_NAME%0A"
            MESSAGE="$MESSAGE<b>Date:</b> $TIMESTAMP%0A"
            MESSAGE="$MESSAGE<b>Message:</b> $LAST_COMMIT_MSG"

            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d parse_mode="HTML" \
              -d text="$MESSAGE"

      - run:
          name: Debug Git Info
          command: |
            echo "CIRCLE_BRANCH: ${CIRCLE_BRANCH}"
            echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
            echo "Remote URL: $(git config --get remote.origin.url)"
            echo "Repo root: $(git rev-parse --show-toplevel)"
            echo "Repo name: $(basename "$(git rev-parse --show-toplevel)")"

      - run:
          name: Prepare Vercel deployment payload (auto repoId)
          command: |
            set -e

            # You can use CircleCI built-ins (more stable than parsing remote)
            ORG_NAME="${CIRCLE_PROJECT_USERNAME}"
            REPO_SLUG="${CIRCLE_PROJECT_REPONAME}"

            if [ -z "$ORG_NAME" ] || [ -z "$REPO_SLUG" ]; then
              echo "❌ Missing CircleCI project env (CIRCLE_PROJECT_USERNAME / CIRCLE_PROJECT_REPONAME)."
              exit 1
            fi

            API_URL="https://api.github.com/repos/$ORG_NAME/$REPO_SLUG"

            REPO_ID=$(curl -sS \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API_URL" | jq -r '.id')

            if [ -z "$REPO_ID" ] || [ "$REPO_ID" = "null" ]; then
              echo "❌ Failed to fetch repoId from GitHub API."
              echo "Response:"
              curl -sS \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API_URL"
              exit 1
            fi

            echo "✅ Repo ID: $REPO_ID"

            # Build payload.json safely (no heredoc, no <<EOF)
            jq -n \
              --arg name "$REPO_SLUG" \
              --arg ref "${CIRCLE_BRANCH}" \
              --arg target "production" \
              --arg type "github" \
              --argjson repoId "$REPO_ID" \
              '{
                name: $name,
                gitSource: {
                  type: $type,
                  repoId: $repoId,
                  ref: $ref
                },
                target: $target
              }' > payload.json

            echo "✅ payload.json created:"
            cat payload.json

      - run:
          name: Trigger Vercel Production Deployment (with retry)
          command: |
            set -e
            ATTEMPT=1
            MAX_ATTEMPTS=2

            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "🔁 Attempt $ATTEMPT of $MAX_ATTEMPTS..."

              HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
                -X POST "https://api.vercel.com/v13/deployments?skipAutoDetectionConfirmation=1" \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                -d @payload.json)

              if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
                echo "✅ Deployment trigger successful!"
                cat response.json
                exit 0
              fi

              echo "⚠️ Deployment failed with status code: $HTTP_CODE"
              echo "Response body:"
              cat response.json
              echo ""
              echo "Retrying in 10 seconds..."
              sleep 10
              ATTEMPT=$((ATTEMPT + 1))
            done

            echo "❌ Deployment failed after $MAX_ATTEMPTS attempts."
            exit 1

      - run:
          name: Notify Telegram — Deployment Success
          command: |
            set -e
            REPO_NAME="${CIRCLE_PROJECT_REPONAME}"
            MESSAGE="✅ <b>Production Deployment Successful</b>%0A<b>Repository:</b> $REPO_NAME%0A<b>Status:</b> Success 🎉"
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d parse_mode="HTML" \
              -d text="$MESSAGE"

      - run:
          name: Notify Telegram — Deployment Failed
          when: on_fail
          command: |
            set -e
            REPO_NAME="${CIRCLE_PROJECT_REPONAME}"
            MESSAGE="❌ <b>Production Deployment Failed</b>%0A<b>Repository:</b> $REPO_NAME%0A<b>Status:</b> Failed 🚨"
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d parse_mode="HTML" \
              -d text="$MESSAGE"

workflows:
  deploy-to-vercel:
    jobs:
      - deploy:
          filters:
            branches:
              only:
                - main
